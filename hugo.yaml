baseURL: "https://griffinai.dev/"
languageCode: "en-ie"
title: "Niall Griffin"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false

pagination:
  pagerSize: 5

minify:
  minifyOutput: true

params:
  mainSections:
    - posts
  env: production
  description: "Notes on building and learning with AI — from an accountant's perspective."
  author: "Niall Griffin"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShareButtons: ["linkedin"]
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "Hello 👋"
    Content: >
      This is a personal 'AI journey' Blog where I just use claude/codex/GLM to
      assist me to create interesting stuff with AI such as this website, built
      from scratch with absolutely zero coding skills. AI is the greatest
      technological leap in my lifetime and I am throwing every bit of time I
      have to learn as quickly and effectively as possible.

      There is no roadmap, no plan, I just build stuff that I find interesting whenever time allows.
      All just talking to AI and copy/paste the code in to the terminal. Incredible

      The overall objective is to have a higher rate of learning of AI than the average person.

      Lets see how we go!



  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/niall-griffin-68220b21/"
    - name: github
      url: "https://github.com/niallgriffin90-ai"
    - name: rss
      url: "index.xml"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: sessions
      name: Sessions
      url: /sessions/
      weight: 15
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON
